const uid = () => Math.random().toString(36).slice(2, 9);
const fmt = (n) => Number(n || 0).toLocaleString("zh-TW");
const itemTotal = (i) => (i.qty || 0) * (i.price || 0);
const protTotal = (arr) => arr.reduce((s, i) => s + itemTotal(i), 0);
const spaceTotal = (sp) => sp.items.reduce((s, i) => s + itemTotal(i), 0);
const matTotal = (arr) => (arr || []).reduce((s, i) => s + itemTotal(i), 0);
const grandTotal = (q) => protTotal(q.protection) + q.spaces.reduce((s, sp) => s + spaceTotal(sp), 0);

function newItem() { return { id: uid(), name: "", unit: "尺", qty: 0, price: 0, note: "" }; }
function newQuote() {
  return {
    id: uid(), projectName: "", address: "", unitNo: "",
    date: new Date().toISOString().slice(0, 10),
    protection: DEFAULT_PROTECTION.map(p => ({ ...p, id: uid() })),
    spaces: [{ id: uid(), name: "天花板", items: [newItem()] }],
    materials: [],
  };
}

function App() {
  const [data, setData] = useState(SEED_DATA);
  const [screen, setScreen] = useState("home");
  const [activeCompany, setActiveCompany] = useState(null);
  const [activeQuoteId, setActiveQuoteId] = useState(null);
  const [editTarget, setEditTarget] = useState(null);

  const quotes = activeCompany ? (data[activeCompany] || []) : [];
  const activeQuote = quotes.find(q => q.id === activeQuoteId) || null;

  const saveQuote = (q) => {
    setData(d => {
      const list = d[activeCompany] || [];
      const idx = list.findIndex(x => x.id === q.id);
      return { ...d, [activeCompany]: idx >= 0 ? list.map(x => x.id === q.id ? q : x) : [...list, q] };
    });
    setActiveQuoteId(q.id);
    setScreen("quote");
  };

  const deleteQuote = (id) => {
    setData(d => ({ ...d, [activeCompany]: (d[activeCompany] || []).filter(q => q.id !== id) }));
    setScreen("company");
  };

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", minHeight: "100vh", background: "#F7F4F0", fontFamily: "'Noto Sans TC','PingFang TC',sans-serif" }}>
      {screen === "home" && <HomeScreen data={data} onSelect={c => { setActiveCompany(c); setScreen("company"); }} />}
      {screen === "company" && <CompanyScreen company={activeCompany} quotes={quotes} onBack={() => setScreen("home")} onSelect={id => { setActiveQuoteId(id); setScreen("quote"); }} onNew={() => { setEditTarget(null); setScreen("edit"); }} />}
      {screen === "quote" && activeQuote && <QuoteScreen quote={activeQuote} company={activeCompany} onBack={() => setScreen("company")} onEdit={() => { setEditTarget(activeQuote); setScreen("edit"); }} onDelete={() => deleteQuote(activeQuote.id)} />}
      {screen === "edit" && <EditScreen initial={editTarget} onSave={saveQuote} onCancel={() => setScreen(editTarget ? "quote" : "company")} />}
    </div>
  );
}

      .space{background:#F5F5F5;font-weight:600;font-size:11px;color:#555;padding:5px 8px;border:1px solid #ddd}
      .sub{text-align:right;font-weight:600;background:#FAFAFA;padding:5px 8px;border:1px solid #e0e0e0}
      .grand{text-align:right;font-size:16px;font-weight:700;padding:10px 8px;border-top:2px solid #333;margin-top:4px}
      .mat-note{font-size:11px;color:#888;text-align:right;padding:4px 8px}
    </style></head><body>
    <h2>工 程 報 價 單</h2>
    <div class="meta">
      <span>案件名稱：<strong>${quote.projectName}</strong></span>
      ${quote.address ? `<span>地址：${quote.address}</span>` : ""}
      ${quote.unitNo ? `<span>戶別：${quote.unitNo}</span>` : ""}
      <span>報價日期：${quote.date}</span>
    </div>
    <table>
      <thead><tr><th>#</th><th>名稱及規格</th><th>單位</th><th class="r">數量</th><th class="r">單價</th><th class="r">總價</th><th>備註</th></tr></thead>
      <tbody>
        <tr><td colspan="7" class="sec">A　保護工程</td></tr>
        ${quote.protection.map((item,i) => `<tr><td>${i+1}</td><td>${item.name}</td><td>${item.unit}</td><td class="r">${item.qty}</td><td class="r">${fmt(item.price)}</td><td class="r">${fmt(itemTotal(item))}</td><td>${item.note||""}</td></tr>`).join("")}
        <tr><td colspan="5" class="sub">保護工程 合計</td><td class="sub">NT$ ${fmt(pTotal)}</td><td></td></tr>
        <tr><td colspan="7" class="sec">B　木作工程</td></tr>
        ${quote.spaces.map(sp => {
          const st = spaceTotal(sp);
          return `<tr><td colspan="7" class="space">　${sp.name}</td></tr>
            ${sp.items.map((item,i) => `<tr><td>${i+1}</td><td>${item.name}</td><td>${item.unit}</td><td class="r">${item.qty}</td><td class="r">${fmt(item.price)}</td><td class="r">${fmt(itemTotal(item))}</td><td>${item.note||""}</td></tr>`).join("")}
            <tr><td colspan="5" class="sub">${sp.name} 小計</td><td class="sub">NT$ ${fmt(st)}</td><td></td></tr>`;
        }).join("")}
      </tbody>
    </table>
    <div class="grand">A、B項總計　NT$ ${fmt(total)}</div>
    ${mTotal > 0 ? `
    <table style="margin-top:16px">
      <thead><tr><th>#</th><th>名稱及規格</th><th>單位</th><th class="r">數量</th><th class="r">單價</th><th class="r">總價</th><th>備註</th></tr></thead>
      <tbody>
        <tr><td colspan="7" class="sec-c">C　木皮材料費（另付設計公司）</td></tr>
        ${(quote.materials||[]).map((item,i) => `<tr><td>${i+1}</td><td>${item.name}</td><td>${item.unit}</td><td class="r">${item.qty}</td><td class="r">${fmt(item.price)}</td><td class="r">${fmt(itemTotal(item))}</td><td>${item.note||""}</td></tr>`).join("")}
        <tr><td colspan="5" class="sub">木皮材料費 小計</td><td class="sub">NT$ ${fmt(mTotal)}</td><td></td></tr>
      </tbody>
    </table>
    <div class="mat-note">※ 木皮材料費另付設計公司，不含於工程報價總計內</div>` : ""}
    </body></html>`);
    w.document.close();
    setTimeout(() => { w.focus(); w.print(); }, 400);
  };

  return (
    <div style={{ paddingBottom: 40 }}>
      <TopBar title={quote.projectName} onBack={onBack} />
      <div style={{ margin: "16px 16px 0", background: "#1C3F6E", borderRadius: 12, padding: "18px 20px", color: "#fff" }}>
        <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", marginBottom: 2 }}>{company}</div>
        <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 8 }}>{quote.projectName}</div>
        <div style={{ display: "flex", gap: 16, fontSize: 12, color: "rgba(255,255,255,0.7)", flexWrap: "wrap" }}>
          {quote.address && <span>📍 {quote.address}</span>}
          {quote.unitNo && <span>戶別 {quote.unitNo}</span>}
          <span>📅 {quote.date}</span>
        </div>
        <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid rgba(255,255,255,0.15)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 12, color: "rgba(255,255,255,0.6)" }}>A、B項總計</span>
            <span style={{ fontSize: 24, fontWeight: 700 }}>NT$ {fmt(total)}</span>
          </div>
          {mTotal > 0 && (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
              <span style={{ fontSize: 11, color: "rgba(255,200,100,0.8)" }}>C 木皮材料費（另付設計公司）</span>
              <span style={{ fontSize: 14, fontWeight: 600, color: "rgba(255,200,100,0.9)" }}>NT$ {fmt(mTotal)}</span>
            </div>
          )}
        </div>
      </div>

      <DesignDrawing quoteId={quote.id} />
      <div style={{ margin: "0 16px 12px", display: "flex", gap: 8 }}>
        <ActionBtn onClick={handlePrint} color="#2B5F8E" flex={2}>匯出 PDF</ActionBtn>
        <ActionBtn onClick={onEdit} color="#A07840" flex={2}>編輯</ActionBtn>
        <ActionBtn onClick={() => setShowDel(true)} color="#C0392B" flex={1}>刪除</ActionBtn>
      </div>

      {showDel && (
        <div style={{ margin: "0 16px 12px", background: "#FDECEA", border: "1px solid #F5C6C2", borderRadius: 10, padding: "14px 16px" }}>
          <div style={{ fontSize: 14, color: "#C0392B", fontWeight: 600, marginBottom: 10 }}>確定要刪除這份估價單？</div>
          <div style={{ display: "flex", gap: 8 }}>
            <ActionBtn onClick={onDelete} color="#C0392B" flex={1}>確定刪除</ActionBtn>
            <ActionBtn onClick={() => setShowDel(false)} color="#6B635C" flex={1}>取消</ActionBtn>
          </div>
        </div>
      )}

      <div style={{ padding: "4px 16px 0" }}>
        <SectionBlock label="A　保護工程" total={pTotal} expanded={expanded.protection} onToggle={() => toggle("protection")}>
          {quote.protection.map((item, i) => <ItemRow key={item.id} index={i+1} item={item} />)}
        </SectionBlock>

        <div style={{ fontSize: 12, fontWeight: 700, color: "#1C3F6E", background: "#E8F0F8", borderRadius: 8, padding: "8px 14px", marginBottom: 8 }}>B　木作工程</div>
        {quote.spaces.map(sp => (
          <SectionBlock key={sp.id} label={sp.name} total={spaceTotal(sp)} expanded={expanded[sp.id]} onToggle={() => toggle(sp.id)} sub>
            {sp.items.map((item, i) => <ItemRow key={item.id} index={i+1} item={item} />)}
          </SectionBlock>
        ))}

        {mTotal > 0 && (
          <>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#A07840", background: "#FBF6EE", borderRadius: 8, padding: "8px 14px", marginBottom: 8, marginTop: 4 }}>
              C　木皮材料費　<span style={{ fontSize: 11, fontWeight: 400, color: "#B89060" }}>（另付設計公司）</span>
            </div>
            <SectionBlock label="木皮材料明細" total={mTotal} expanded={expanded.materials} onToggle={() => toggle("materials")} gold>
              {(quote.materials || []).map((item, i) => <ItemRow key={item.id} index={i+1} item={item} />)}
            </SectionBlock>
          </>
        )}
      </div>
    </div>
  );
}

function SectionBlock({ label, total, expanded, onToggle, children, sub, gold }) {
  const headerBg = gold ? "#FBF6EE" : sub ? "#FAFAF8" : "#EEF4FB";
  const textColor = gold ? "#A07840" : "#1C3F6E";
  return (
    <div style={{ background: "#fff", borderRadius: 10, marginBottom: 10, overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
      <div onClick={onToggle} style={{ padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", background: headerBg }}>
        <span style={{ fontSize: 13, fontWeight: 600, color: sub ? "#1A1714" : textColor }}>{label}</span>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: textColor }}>NT$ {fmt(total)}</span>
          <span style={{ fontSize: 14, color: "#9C948D", transform: expanded ? "rotate(90deg)" : "none", transition: "transform 0.2s" }}>›</span>
        </div>
      </div>
      {expanded && <div style={{ padding: "4px 0 8px" }}>{children}</div>}
    </div>
  );
}

function ItemRow({ index, item }) {
  const total = itemTotal(item);
  return (
    <div style={{ padding: "10px 16px", borderBottom: "1px solid #F5F2EE" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: item.note ? 4 : 0 }}>
        <div style={{ flex: 1, paddingRight: 12 }}>
          <span style={{ fontSize: 11, color: "#C8C0B8", marginRight: 6 }}>{index}.</span>
          <span style={{ fontSize: 14, color: "#1A1714" }}>{item.name}</span>
        </div>
        <div style={{ textAlign: "right", flexShrink: 0 }}>
          <div style={{ fontSize: 13, color: "#4A4440", marginBottom: 2 }}>{item.qty} {item.unit} × {fmt(item.price)}</div>
          <div style={{ fontSize: 15, fontWeight: 700, color: total > 0 ? "#1C3F6E" : "#9C948D" }}>{total > 0 ? `NT$ ${fmt(total)}` : "—"}</div>
        </div>
      </div>
      {item.note && <div style={{ fontSize: 11, color: "#6B635C", paddingLeft: 18, lineHeight: 1.5 }}>{item.note}</div>}
    </div>
  );
}

function ActionBtn({ children, onClick, color, flex = 1 }) {
  return (
    <button onClick={onClick} style={{ flex, padding: "10px 0", background: color, color: "#fff", border: "none", borderRadius: 8, fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>{children}</button>
  );
}

function EditScreen({ initial, onSave, onCancel }) {
  const [form, setForm] = useState(() => initial ? JSON.parse(JSON.stringify(initial)) : newQuote());

  const setMeta = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const setProtItem = (id, k, v) => setForm(f => ({ ...f, protection: f.protection.map(p => p.id === id ? { ...p, [k]: ["qty","price"].includes(k) ? parseFloat(v)||0 : v } : p) }));
  const addProtItem = () => setForm(f => ({ ...f, protection: [...f.protection, { id: uid(), name: "", unit: "式", qty: 1, price: 0, note: "" }] }));
  const delProtItem = (id) => setForm(f => ({ ...f, protection: f.protection.filter(p => p.id !== id) }));

  const addSpace = () => setForm(f => ({ ...f, spaces: [...f.spaces, { id: uid(), name: "", items: [newItem()] }] }));
  const delSpace = (sid) => setForm(f => ({ ...f, spaces: f.spaces.filter(s => s.id !== sid) }));
  const setSpaceName = (sid, v) => setForm(f => ({ ...f, spaces: f.spaces.map(s => s.id === sid ? { ...s, name: v } : s) }));
  const addItem = (sid) => setForm(f => ({ ...f, spaces: f.spaces.map(s => s.id === sid ? { ...s, items: [...s.items, newItem()] } : s) }));
  const delItem = (sid, iid) => setForm(f => ({ ...f, spaces: f.spaces.map(s => s.id === sid ? { ...s, items: s.items.filter(i => i.id !== iid) } : s) }));
  const setItem = (sid, iid, k, v) => setForm(f => ({ ...f, spaces: f.spaces.map(s => s.id === sid ? { ...s, items: s.items.map(i => i.id === iid ? { ...i, [k]: ["qty","price"].includes(k) ? parseFloat(v)||0 : v } : i) } : s) }));

  const setMatItem = (id, k, v) => setForm(f => ({ ...f, materials: (f.materials||[]).map(m => m.id === id ? { ...m, [k]: ["qty","price"].includes(k) ? parseFloat(v)||0 : v } : m) }));
  const addMatItem = () => setForm(f => ({ ...f, materials: [...(f.materials||[]), { id: uid(), name: "", unit: "張", qty: 0, price: 0, note: "" }] }));
  const delMatItem = (id) => setForm(f => ({ ...f, materials: (f.materials||[]).filter(m => m.id !== id) }));

  const total = grandTotal(form);
  const mTotal = matTotal(form.materials);
  const isValid = form.projectName.trim().length > 0;

  return (
    <div style={{ paddingBottom: 120 }}>
      <TopBar title={initial ? "編輯估價單" : "新增估價單"} onBack={onCancel} />
      <div style={{ padding: "16px 16px 0" }}>
        <EditCard label="案場資訊">
          <EditField label="案件名稱 *" value={form.projectName} onChange={v => setMeta("projectName", v)} placeholder="例：南悅豐映2A3" />
          <EditField label="地址" value={form.address} onChange={v => setMeta("address", v)} placeholder="地址（選填）" />
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}><EditField label="戶別" value={form.unitNo} onChange={v => setMeta("unitNo", v)} placeholder="例：9A" /></div>
            <div style={{ flex: 1 }}><EditField label="報價日期" type="date" value={form.date} onChange={v => setMeta("date", v)} /></div>
          </div>
        </EditCard>

        <EditCard label="A　保護工程">
          {form.protection.map((item, i) => <EditItemBlock key={item.id} item={item} index={i+1} onSet={(k,v) => setProtItem(item.id,k,v)} onDel={() => delProtItem(item.id)} />)}
          <AddRowBtn onClick={addProtItem} label="新增保護項目" />
          <TotalRow label="保護工程 合計" total={protTotal(form.protection)} />
        </EditCard>

        <div style={{ fontSize: 12, fontWeight: 700, color: "#1C3F6E", background: "#E8F0F8", borderRadius: 8, padding: "8px 14px", marginBottom: 10 }}>B　木作工程</div>
        {form.spaces.map(sp => (
          <EditCard key={sp.id} label={
            <input value={sp.name} onChange={e => setSpaceName(sp.id, e.target.value)} placeholder="空間名稱（例：主臥室）"
              style={{ border: "none", background: "transparent", fontSize: 14, fontWeight: 700, color: "#1A1714", fontFamily: "inherit", outline: "none", width: "100%" }} />
          } onDelete={() => delSpace(sp.id)}>
            {sp.items.map((item, i) => <EditItemBlock key={item.id} item={item} index={i+1} onSet={(k,v) => setItem(sp.id,item.id,k,v)} onDel={() => delItem(sp.id,item.id)} />)}
            <AddRowBtn onClick={() => addItem(sp.id)} label="新增工項" />
            <TotalRow label={`${sp.name||"此空間"} 小計`} total={spaceTotal(sp)} />
          </EditCard>
        ))}
        <button onClick={addSpace} style={{ width: "100%", padding: "12px", background: "#fff", border: "2px dashed #C8C0B8", borderRadius: 10, fontSize: 14, color: "#6B635C", cursor: "pointer", fontFamily: "inherit", marginBottom: 12 }}>＋ 新增空間</button>

        <div style={{ fontSize: 12, fontWeight: 700, color: "#A07840", background: "#FBF6EE", borderRadius: 8, padding: "8px 14px", marginBottom: 10 }}>
          C　木皮材料費 <span style={{ fontSize: 11, fontWeight: 400 }}>（另付設計公司）</span>
        </div>
        <EditCard label="木皮材料明細">
          {(form.materials||[]).map((item, i) => <EditItemBlock key={item.id} item={item} index={i+1} onSet={(k,v) => setMatItem(item.id,k,v)} onDel={() => delMatItem(item.id)} />)}
          <AddRowBtn onClick={addMatItem} label="新增材料項目" />
          <TotalRow label="木皮材料費 小計" total={mTotal} gold />
        </EditCard>
      </div>

      <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 480, background: "#fff", borderTop: "1px solid #E2DDD8", padding: "12px 16px", boxSizing: "border-box" }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: mTotal > 0 ? 4 : 8 }}>
          <span style={{ fontSize: 12, color: "#9C948D" }}>A、B項總計</span>
          <span style={{ fontSize: 16, fontWeight: 700, color: "#1C3F6E" }}>NT$ {fmt(total)}</span>
        </div>
        {mTotal > 0 && (
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontSize: 11, color: "#A07840" }}>C 木皮材料費</span>
            <span style={{ fontSize: 13, fontWeight: 600, color: "#A07840" }}>NT$ {fmt(mTotal)}</span>
          </div>
        )}
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={onCancel} style={{ flex: 1, padding: "12px", background: "#F7F4F0", border: "1px solid #E2DDD8", borderRadius: 8, fontSize: 15, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", color: "#6B635C" }}>取消</button>
          <button onClick={() => { if (isValid) onSave(form); }} style={{ flex: 2, padding: "12px", background: isValid ? "#1C3F6E" : "#C8C0B8", border: "none", borderRadius: 8, fontSize: 15, fontWeight: 700, cursor: isValid ? "pointer" : "not-allowed", fontFamily: "inherit", color: "#fff" }}>
            {isValid ? "儲存估價單" : "請輸入案件名稱"}
          </button>
        </div>
      </div>
    </div>
  );
}

function EditCard({ label, children, onDelete }) {
  return (
    <div style={{ background: "#fff", borderRadius: 12, marginBottom: 12, overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
      <div style={{ padding: "10px 16px", borderBottom: "1px solid #F0ECE8", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        {typeof label === "string" ? <span style={{ fontSize: 13, fontWeight: 700, color: "#1C3F6E" }}>{label}</span> : label}
        {onDelete && <button onClick={onDelete} style={{ background: "#FDECEA", border: "none", color: "#C0392B", fontSize: 11, padding: "3px 8px", borderRadius: 4, cursor: "pointer", fontFamily: "inherit" }}>刪除空間</button>}
      </div>
      <div style={{ padding: "12px 16px" }}>{children}</div>
    </div>
  );
}

function EditField({ label, value, onChange, placeholder, type = "text" }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ fontSize: 11, color: "#9C948D", marginBottom: 4 }}>{label}</div>
      <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
        style={{ width: "100%", boxSizing: "border-box", border: "1px solid #E2DDD8", borderRadius: 6, padding: "10px 12px", fontSize: 15, fontFamily: "inherit", background: "#FAFAF8", outline: "none", color: "#1A1714" }} />
    </div>
  );
}

function EditItemBlock({ item, index, onSet, onDel }) {
  return (
    <div style={{ borderBottom: "1px solid #F5F2EE", paddingBottom: 12, marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
        <span style={{ fontSize: 11, color: "#9C948D" }}>項目 {index}</span>
        <button onClick={onDel} style={{ background: "none", border: "none", color: "#C0392B", fontSize: 18, cursor: "pointer", lineHeight: 1, padding: "0 4px" }}>×</button>
      </div>
      <input value={item.name} onChange={e => onSet("name", e.target.value)} placeholder="項目名稱"
        style={{ width: "100%", boxSizing: "border-box", border: "1px solid #E2DDD8", borderRadius: 6, padding: "9px 12px", fontSize: 14, fontFamily: "inherit", background: "#FAFAF8", outline: "none", marginBottom: 8 }} />
      <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 10, color: "#9C948D", marginBottom: 3 }}>單位</div>
          <select value={item.unit} onChange={e => onSet("unit", e.target.value)}
            style={{ width: "100%", border: "1px solid #E2DDD8", borderRadius: 6, padding: "9px 8px", fontSize: 14, fontFamily: "inherit", background: "#FAFAF8", outline: "none" }}>
            {UNITS.map(u => <option key={u} value={u}>{u}</option>)}
          </select>
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 10, color: "#9C948D", marginBottom: 3 }}>數量</div>
          <input type="number" value={item.qty} onChange={e => onSet("qty", e.target.value)}
            style={{ width: "100%", boxSizing: "border-box", border: "1px solid #E2DDD8", borderRadius: 6, padding: "9px 10px", fontSize: 14, fontFamily: "inherit", background: "#FAFAF8", outline: "none", textAlign: "right" }} />
        </div>
        <div style={{ flex: 1.4 }}>
          <div style={{ fontSize: 10, color: "#9C948D", marginBottom: 3 }}>單價</div>
          <input type="number" value={item.price} onChange={e => onSet("price", e.target.value)}
            style={{ width: "100%", boxSizing: "border-box", border: "1px solid #E2DDD8", borderRadius: 6, padding: "9px 10px", fontSize: 14, fontFamily: "inherit", background: "#FAFAF8", outline: "none", textAlign: "right" }} />
        </div>
      </div>
      <div style={{ fontSize: 12, color: "#1C3F6E", fontWeight: 600, textAlign: "right", marginBottom: 6 }}>小計：NT$ {fmt(itemTotal(item))}</div>
      <input value={item.note} onChange={e => onSet("note", e.target.value)} placeholder="備註（選填）"
        style={{ width: "100%", boxSizing: "border-box", border: "1px solid #E2DDD8", borderRadius: 6, padding: "8px 12px", fontSize: 13, fontFamily: "inherit", background: "#FAFAF8", outline: "none", color: "#6B635C" }} />
    </div>
  );
}

function AddRowBtn({ onClick, label }) {
  return (
    <button onClick={onClick} style={{ width: "100%", padding: "9px", background: "#F7F4F0", border: "1px dashed #C8C0B8", borderRadius: 6, fontSize: 13, color: "#6B635C", cursor: "pointer", fontFamily: "inherit", marginBottom: 8 }}>＋ {label}</button>
  );
}

function TotalRow({ label, total, gold }) {
  return (
    <div style={{ textAlign: "right", paddingTop: 4, fontSize: 13, color: gold ? "#A07840" : "#6B635C" }}>
      {label}　<strong style={{ color: gold ? "#A07840" : "#1C3F6E" }}>NT$ {fmt(total)}</strong>
    </div>
  );
}

function TopBar({ title, onBack }) {
  return (
    <div style={{ background: "#fff", borderBottom: "1px solid #E2DDD8", padding: "14px 16px", display: "flex", alignItems: "center", gap: 12, position: "sticky", top: 0, zIndex: 10 }}>
      <button onClick={onBack} style={{ background: "none", border: "none", fontSize: 20, color: "#1C3F6E", cursor: "pointer", padding: "0 4px", lineHeight: 1 }}>‹</button>
      <span style={{ fontSize: 16, fontWeight: 700, color: "#1A1714" }}>{title}</span>
    </div>
  );
}

    
    function AppWithDB() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [screen, setScreen] = useState("home");
      const [activeCompany, setActiveCompany] = useState(null);
      const [activeQuoteId, setActiveQuoteId] = useState(null);
      const [editTarget, setEditTarget] = useState(null);

      useEffect(() => { loadData(); }, []);

      const loadData = async () => {
        setLoading(true);
        const { data: rows, error } = await supabase.from("quotes").select("*");
        if (error) {
          setData(SEED_DATA);
        } else if (rows && rows.length > 0) {
          const reconstructed = {};
          COMPANIES.forEach(c => reconstructed[c] = []);
          rows.forEach(row => {
            if (reconstructed[row.company]) reconstructed[row.company].push(row.data);
          });
          setData(reconstructed);
        } else {
          const inserts = [];
          COMPANIES.forEach(company => {
            (SEED_DATA[company] || []).forEach(quote => {
              inserts.push({ id: quote.id, company, data: quote });
            });
          });
          if (inserts.length > 0) await supabase.from("quotes").insert(inserts);
          setData(SEED_DATA);
        }
        setLoading(false);
      };

      const saveQuote = async (q) => {
        await supabase.from("quotes").upsert({ id: q.id, company: activeCompany, data: q });
        setData(d => {
          const list = d[activeCompany] || [];
          const idx = list.findIndex(x => x.id === q.id);
          return { ...d, [activeCompany]: idx >= 0 ? list.map(x => x.id === q.id ? q : x) : [...list, q] };
        });
        setActiveQuoteId(q.id);
        setScreen("quote");
      };

      const deleteQuote = async (id) => {
        await supabase.from("quotes").delete().eq("id", id);
        // also delete design files
        const { data: existing } = await supabase.storage.from("designs").list(id);
        if (existing && existing.length > 0) {
          await supabase.storage.from("designs").remove(existing.map(f => `${id}/${f.name}`));
        }
        setData(d => ({ ...d, [activeCompany]: (d[activeCompany] || []).filter(q => q.id !== id) }));
        setScreen("company");
      };

      if (loading) {
        return (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", flexDirection: "column", gap: 12, fontFamily: "sans-serif", color: "#6B635C" }}>
            <div style={{ fontSize: 32 }}>📋</div>
            <div>載入中...</div>
          </div>
        );
      }

      const quotes = activeCompany ? (data[activeCompany] || []) : [];
      const activeQuote = quotes.find(q => q.id === activeQuoteId) || null;

      return (
        <div style={{ maxWidth: 480, margin: "0 auto", minHeight: "100vh", background: "#F7F4F0", fontFamily: "'Noto Sans TC','PingFang TC',sans-serif" }}>
          {screen === "home" && <HomeScreen data={data} onSelect={c => { setActiveCompany(c); setScreen("company"); }} />}
          {screen === "company" && <CompanyScreen company={activeCompany} quotes={quotes} onBack={() => setScreen("home")} onSelect={id => { setActiveQuoteId(id); setScreen("quote"); }} onNew={() => { setEditTarget(null); setScreen("edit"); }} />}
          {screen === "quote" && activeQuote && <QuoteScreen quote={activeQuote} company={activeCompany} onBack={() => setScreen("company")} onEdit={() => { setEditTarget(activeQuote); setScreen("edit"); }} onDelete={() => deleteQuote(activeQuote.id)} />}
          {screen === "edit" && <EditScreen initial={editTarget} onSave={saveQuote} onCancel={() => setScreen(editTarget ? "quote" : "company")} />}
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppWithDB />);
  </script>
</body>
</html>
